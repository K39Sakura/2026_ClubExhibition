<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席・机管理</title>
  <style>
    .form-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
    button { border: none; border-radius: 6px; background: #1F487E; color: white; padding: 0.6rem 1.2rem; writing-mode: horizontal-tb; font-size: 0.95rem; cursor: pointer; transition: background-color 0.2s ease; }
    button:hover { background: #1D3461; }
    button:disabled { background: #8a9bb0; cursor: default; }
    .form-row span { font-weight: 600; color: #212121; }
    #message { min-height: 1.4rem; margin-top: 0.5rem; color: #bf360c; }
    #refreshBtn { background: #d31733; font-weight: 600; }
    #refreshBtn:hover { background: #A31621; }
    #modeBtn { background: #37718E; }
    #modeBtn.editing { background: #e08e0b; }

    /* ===== 選択中の机の操作パネル ===== */
    #deskPanel { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem; background: white; border: 1px solid #dce3e8; border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; min-height: 2.6rem; }
    #deskPanel .panel-title { font-weight: 700; }
    #deskPanel input, #deskPanel select { padding: 0.4rem 0.5rem; border: 1px solid #cfd8dc; border-radius: 4px; font-size: 0.95rem; }
    #deskPanel input { width: 7rem; }
    #deskPanel .hint { color: #555; }
    #deskPanel .danger { background: #a33; }
    #deskPanel .danger:hover { background: #811; }
    .edit-only, .normal-only { display: none; }
    body.mode-edit .edit-only, body.mode-normal .normal-only { display: inline-flex; align-items: center; gap: 0.4rem; }

    /* ===== 見取り図 ===== */
    #floorWrap { position: relative; width: 100%; overflow: hidden; }
    #floor { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #f4f1ea; border: 3px solid #5b5b5b; box-sizing: border-box; border-radius: 4px; }
    body.mode-edit #floor { background-color: #fbf8f1; background-image: linear-gradient(#e2ddd2 1px, transparent 1px), linear-gradient(90deg, #e2ddd2 1px, transparent 1px); background-size: 20px 20px; }

    .desk { position: absolute; box-sizing: border-box; border-radius: 5px; border: 2px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; line-height: 1.15; user-select: none; touch-action: none; }
    .desk.free { background: #AED9E0; border-color: #37718E; }
    .desk.occupied { background: #FFA69E; border-color: #C33C54; }
    .desk.selected { outline: 3px solid #e08e0b; outline-offset: 3px; }
    .desk.drop-target { box-shadow: 0 0 0 4px #0288d1; }
    body.mode-edit .desk { cursor: move; }
    body.mode-normal .desk { cursor: pointer; }
    .desk .desk-label { display: flex; flex-direction: column; align-items: center; white-space: nowrap; pointer-events: none; }
    .desk .desk-name { font-weight: 700; pointer-events: none; }
    .desk .desk-info { font-size: 10px; pointer-events: none; }

    .chair { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #e8f4ff; border: 1px solid #5b7c93; box-sizing: border-box; font-size: 9px; display: flex; align-items: center; justify-content: center; }
    body.mode-normal .chair { cursor: grab; }
    .chair.dragging { opacity: 0.4; }
  </style>
</head>
<body class="mode-normal" style="background-color: #CED3DC;">
  <h2>机と席の管理</h2>
  <div class="form-row">
    <button id="addDeskBtn" type="button">机を追加</button>
    <span id="deskStatus">残り机: 0</span>
    <button id="addSeatBtn" type="button">椅子を追加</button>
    <span id="seatStatus">残り椅子: 0</span>
    <button id="refreshBtn" type="button">更新</button>
    <button id="modeBtn" type="button">配置編集モードにする</button>
  </div>
  <div>机をクリックで選択。椅子はダブルクリックで削除（プールに戻る）、ドラッグ＆ドロップで机間移動可能。</div>
  <div>机の位置・大きさ・向きを変えるときは<strong>配置編集モード</strong>に切り替えて、机をドラッグしてください。</div>
  <div>変更があった場合、ブラウザの再読み込みボタン、F5ではなく<strong>更新ボタン</strong>をクリックしてください。</div>

  <div id="message" role="status" aria-live="polite"></div>

  <div id="deskPanel">
    <span class="hint" id="panelHint">机をクリックすると、ここで操作できます。</span>
    <span id="panelBody" hidden>
      <span class="panel-title" id="panelName"></span>
      <span class="normal-only">
        <button id="statusBtn" type="button">空席</button>
        <button id="panelAddSeatBtn" type="button">椅子＋</button>
        <button id="panelRemoveSeatBtn" type="button">椅子−</button>
      </span>
      <span class="edit-only">
        <label for="nameInput">名前</label>
        <input id="nameInput" type="text" maxlength="12">
        <label for="typeSelect">大きさ</label>
        <select id="typeSelect"></select>
        <button id="rotateLeftBtn" type="button" title="左に45°回転">⟲ 45°</button>
        <button id="rotateRightBtn" type="button" title="右に45°回転">⟳ 45°</button>
      </span>
      <button id="deleteDeskBtn" type="button" class="danger">机を削除</button>
    </span>
  </div>

  <div id="floorWrap">
    <div id="floor" aria-live="polite"></div>
  </div>

  <script>
    // ===== DOM要素の取得 =====
    const floorWrap = document.getElementById('floorWrap');
    const floorEl = document.getElementById('floor');        // 見取り図（机を置く部屋）
    const message = document.getElementById('message');      // メッセージ表示用

    // ===== 見取り図の設定 =====
    // 見取り図は 1000 x 600 の論理座標で管理し、画面幅に合わせて拡大縮小する
    const FLOOR_W = 1000;
    const FLOOR_H = 600;
    const GRID = 10;                                          // 机を動かすときのマス目
    const CHAIR_SIZE = 18;                                    // .chair の width/height と合わせる
    const DESK_TYPES = {
      long:   { label: '長机',   w: 110, h: 36 },
      medium: { label: '中机',   w: 70,  h: 36 },
      square: { label: '正方形', w: 55,  h: 55 },
      big:    { label: '大机',   w: 110, h: 70 },
    };
    const DEFAULT_TYPE = 'long';

    // ===== グローバル変数 =====
    let desks = [];                                           // すべての机のデータ配列
    let totalDesks = 0;                                       // 最初に用意した机の総数
    let totalSeats = 0;                                       // 最初に用意した椅子の総数
    let remainingDesks = 0;                                   // まだ使われていない机の数
    let remainingSeats = 0;                                   // まだ使われていない椅子の数
    let mode = 'normal';                                      // 'normal'（運用）または 'edit'（配置編集）
    let selectedDeskId = null;
    let floorScale = 1;
    let deskDrag = null;                                      // 机をドラッグ中の情報
    let chairDragging = false;
    let lastLocalChange = 0;                                  // 最後に自分が変更した時刻

    function createSeat(id) {
      return { id };
    }

    function createDesk(name, seatCount, pos) {
      const seats = Array.from({ length: seatCount }, (_, i) =>
        createSeat(`${name}-seat-${i + 1}`)
      );
      return {
        id: `${Date.now()}-${Math.random()}`,  // ユニークなID生成
        name,
        seatCount,
        status: 'free',                        // 'free'または'occupied'
        seats,
        type: DEFAULT_TYPE,                    // 机の大きさ（DESK_TYPESのキー）
        rotation: 0,                           // 角度（0〜315、45°刻み）
        x: pos ? pos.x : null,                 // 見取り図上の左上座標
        y: pos ? pos.y : null,
      };
    }

    // 回転前の机の幅・高さ
    function deskSize(desk) {
      const t = DESK_TYPES[desk.type] || DESK_TYPES[DEFAULT_TYPE];
      return { w: t.w, h: t.h };
    }

    // 角度を 0〜315 の 45° 刻みにそろえる
    function normalizeRotation(r) {
      const n = Math.round((Number(r) || 0) / 45) * 45;
      return ((n % 360) + 360) % 360;
    }

    // 回転後の机を囲む四角（見取り図上の座標）
    // desk.x, desk.y は回転前の机の左上。回転は机の中心で行う
    function deskBounds(desk) {
      const { w, h } = deskSize(desk);
      const rad = desk.rotation * Math.PI / 180;
      const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
      const bw = w * cos + h * sin;
      const bh = w * sin + h * cos;
      const cx = desk.x + w / 2, cy = desk.y + h / 2;
      return { x: cx - bw / 2, y: cy - bh / 2, w: bw, h: bh };
    }

    function clampDesk(desk) {
      // 椅子が部屋からはみ出さないよう、壁から少し離す
      const pad = 30;
      const b = deskBounds(desk);
      const bx = Math.max(pad, Math.min(FLOOR_W - b.w - pad, b.x));
      const by = Math.max(pad, Math.min(FLOOR_H - b.h - pad, b.y));
      desk.x = Math.round(desk.x + bx - b.x);
      desk.y = Math.round(desk.y + by - b.y);
    }

    // 他の机と重ならない空き場所を探す（見つからなければ左上）
    // 戻り値は回転前の机の左上座標
    function findFreeSpot(desk) {
      const { w, h } = deskSize(desk);
      const b0 = deskBounds({ ...desk, x: 0, y: 0 });   // 左上からのずれを求める
      const margin = CHAIR_SIZE + 10;   // 椅子の分だけ間をあける
      for (let y = margin; y + b0.h <= FLOOR_H; y += GRID * 2) {
        for (let x = margin; x + b0.w <= FLOOR_W; x += GRID * 2) {
          const hit = desks.some(o => {
            if (o === desk || o.x == null) return false;
            const s = deskBounds(o);
            return x < s.x + s.w + margin && s.x < x + b0.w + margin &&
                   y < s.y + s.h + margin && s.y < y + b0.h + margin;
          });
          if (!hit) return { x: Math.round(x - b0.x), y: Math.round(y - b0.y) };
        }
      }
      return { x: margin - b0.x, y: margin - b0.y };
    }

    // 位置が未設定の机（古いデータなど）を自動で並べる
    function placeUnplacedDesks() {
      desks.forEach(d => {
        if (!Number.isFinite(d.x) || !Number.isFinite(d.y)) {
          d.x = null; d.y = null;
          const spot = findFreeSpot(d);
          d.x = spot.x; d.y = spot.y;
        }
        clampDesk(d);
      });
    }

    function nextDeskName() {
      const nums = desks.map(d => Number((d.name.match(/(\d+)$/) || [])[1]) || 0);
      return `机 ${Math.max(0, ...nums) + 1}`;
    }

    // ===== データ保存・読み込み =====
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwZDawi8TC3dBhZqMEACrGEk2GnwVPqa8djNbCMCsPRX8evpzeBYaUZo8gJo8j75ek/exec";

    async function saveDesksToCloud(data) {
      await fetch(CLOUD_URL, {
        method: "POST",
        body: JSON.stringify(data),
      });
    }

    async function loadDesksFromCloud() {
      const res = await fetch(CLOUD_URL);
      return await res.json();
    }

    function adjustDeskSeats(desk, desiredCount) {
      desiredCount = Number.isInteger(desiredCount) ? desiredCount : 0;
      desk.seatCount = Math.max(0, Math.min(50, desiredCount));

      // 実際の椅子数をseatCountに合わせる
      if (desk.seats.length > desk.seatCount) {
        desk.seats = desk.seats.slice(0, desk.seatCount);
      }
    }

    async function loadData() {
      try {
        const parsed = await loadDesksFromCloud();
        if (!parsed) return;

        // 新しいデータ形式（オブジェクト）
        if (parsed && typeof parsed === 'object' && Array.isArray(parsed.desks)) {
          totalDesks = Number.isInteger(parsed.totalDesks) ? parsed.totalDesks : 0;
          totalSeats = Number.isInteger(parsed.totalSeats) ? parsed.totalSeats : 0;
          remainingDesks = Number.isInteger(parsed.remainingDesks) ? parsed.remainingDesks : 0;
          remainingSeats = Number.isInteger(parsed.remainingSeats) ? parsed.remainingSeats : 0;

          desks = parsed.desks.map(d => ({
            id: d.id || `${Date.now()}-${Math.random()}`,
            name: d.name || '机',
            seatCount: Number.isInteger(d.seatCount) ? d.seatCount : 0,
            status: d.status === 'occupied' ? 'occupied' : 'free',
            seats: Array.isArray(d.seats)
              ? d.seats.map(s => ({ id: s.id || `${d.name}-seat` }))
              : [],
            type: DESK_TYPES[d.type] ? d.type : DEFAULT_TYPE,
            rotation: normalizeRotation(d.rotation),
            x: Number.isFinite(d.x) ? d.x : null,
            y: Number.isFinite(d.y) ? d.y : null,
          }));

          desks.forEach(d => adjustDeskSeats(d, d.seatCount));
          placeUnplacedDesks();
        }
      } catch (e) {
        console.warn("クラウド読み込み失敗", e);
      }
    }

    async function saveData() {
      lastLocalChange = Date.now();

      // 使用中の机に置かれている椅子の数を計算
      const occupiedSeats = desks
        .filter(d => d.status === 'occupied')
        .reduce((sum, d) => sum + d.seats.length, 0);

      await saveDesksToCloud({
        totalDesks,
        totalSeats,
        remainingDesks,
        remainingSeats,
        occupiedSeats,  // 使用中の机の椅子数を追加
        desks
      });
      lastLocalChange = Date.now();
    }

    // 変更を保存して画面に反映する
    function commit() {
      saveData();
      render();
    }

    function updateStatus() {
      const deskStatus = document.getElementById('deskStatus');
      const seatStatus = document.getElementById('seatStatus');
      if (deskStatus) deskStatus.textContent = `残り机: ${remainingDesks}`;
      if (seatStatus) seatStatus.textContent = `残り椅子: ${remainingSeats}`;
    }

    // ===== 見取り図の拡大縮小 =====
    function fitFloor() {
      floorScale = Math.min(1, floorWrap.clientWidth / FLOOR_W);
      floorEl.style.width = `${FLOOR_W}px`;
      floorEl.style.height = `${FLOOR_H}px`;
      floorEl.style.transform = `scale(${floorScale})`;
      floorWrap.style.height = `${FLOOR_H * floorScale}px`;
    }
    window.addEventListener('resize', fitFloor);

    // ===== 椅子の並べ方 =====
    // 机のまわり（長い辺を優先）に椅子を並べた座標（机の左上からの相対位置）を返す
    function chairPositions(w, h, n) {
      const step = CHAIR_SIZE + 4;
      const off = CHAIR_SIZE / 2 + 3;
      const capH = Math.max(1, Math.floor(w / step));   // 上下の辺に置ける数
      const capV = Math.max(1, Math.floor(h / step));   // 左右の辺に置ける数
      const sides = [
        { key: 'top', cap: capH, long: w >= h },
        { key: 'bottom', cap: capH, long: w >= h },
        { key: 'left', cap: capV, long: h >= w },
        { key: 'right', cap: capV, long: h >= w },
      ];
      // 長い辺 → 短い辺の順に、交互に詰める
      const order = [...sides.filter(s => s.long), ...sides.filter(s => !s.long)];
      const counts = { top: 0, bottom: 0, left: 0, right: 0 };
      const assign = [];
      for (let i = 0; i < n; i++) {
        let side = null;
        const longSides = order.filter(s => s.long && counts[s.key] < s.cap);
        if (longSides.length) {
          side = longSides.reduce((a, b) => (counts[b.key] < counts[a.key] ? b : a));
        } else {
          const rest = order.filter(s => counts[s.key] < s.cap);
          side = rest.length
            ? rest.reduce((a, b) => (counts[b.key] < counts[a.key] ? b : a))
            : order.reduce((a, b) => (counts[b.key] < counts[a.key] ? b : a)); // 満席なら重ねて置く
        }
        assign.push({ side: side.key, idx: counts[side.key] });
        counts[side.key]++;
      }
      return assign.map(({ side, idx }) => {
        const m = counts[side];
        switch (side) {
          case 'top':    return { x: w * (idx + 1) / (m + 1), y: -off };
          case 'bottom': return { x: w * (idx + 1) / (m + 1), y: h + off };
          case 'left':   return { x: -off, y: h * (idx + 1) / (m + 1) };
          default:       return { x: w + off, y: h * (idx + 1) / (m + 1) };
        }
      });
    }

    // ===== 椅子の移動 =====
    function moveSeat(fromDeskId, seatIndex, toDeskId) {
      const fromDesk = desks.find(d => d.id === fromDeskId);
      const toDesk = desks.find(d => d.id === toDeskId);
      if (!fromDesk || !toDesk || fromDesk === toDesk) return;
      if (toDesk.seats.length >= 50) return;
      const movedSeat = fromDesk.seats.splice(seatIndex, 1)[0];
      if (!movedSeat) return;
      toDesk.seats.push(movedSeat);
      fromDesk.seatCount = fromDesk.seats.length;
      toDesk.seatCount = toDesk.seats.length;
      commit();
    }

    function addSeatToDesk(desk) {
      if (!desk) return;
      if (remainingSeats <= 0) {
        message.textContent = '残り椅子がありません。';
        return;
      }
      if (desk.seats.length >= 50) {
        message.textContent = 'この机の椅子は最大です。';
        return;
      }
      desk.seats.push(createSeat(`${desk.name}-seat-${desk.seats.length + 1}`));
      desk.seatCount = desk.seats.length;
      remainingSeats -= 1;
      commit();
    }

    function removeSeatFromDesk(desk, idx) {
      if (!desk || desk.seats.length === 0) return;
      const i = idx == null ? desk.seats.length - 1 : idx;
      if (!desk.seats.splice(i, 1)[0]) return;
      desk.seatCount = desk.seats.length;
      remainingSeats += 1;
      message.textContent = `椅子をプールに戻しました。残り椅子: ${remainingSeats}`;
      commit();
    }

    // ===== 描画 =====
    function render() {
      floorEl.innerHTML = '';

      desks.forEach(desk => {
        const { w, h } = deskSize(desk);
        const deskEl = document.createElement('div');
        deskEl.className = `desk ${desk.status}` + (desk.id === selectedDeskId ? ' selected' : '');
        deskEl.dataset.id = desk.id;
        deskEl.style.left = `${desk.x}px`;
        deskEl.style.top = `${desk.y}px`;
        deskEl.style.width = `${w}px`;
        deskEl.style.height = `${h}px`;
        deskEl.style.transform = `rotate(${desk.rotation}deg)`;
        // 文字は傾かないよう逆向きに回す
        const upright = `rotate(${-desk.rotation}deg)`;

        const label = document.createElement('span');
        label.className = 'desk-label';
        label.style.transform = upright;
        const name = document.createElement('span');
        name.className = 'desk-name';
        name.textContent = desk.name;
        const info = document.createElement('span');
        info.className = 'desk-info';
        info.textContent = `${desk.status === 'occupied' ? '使用中' : '空席'} / ${desk.seats.length}席`;
        label.append(name, info);
        deskEl.append(label);

        // 机の選択・ドラッグ（配置編集モードのみ移動）
        deskEl.addEventListener('pointerdown', e => onDeskPointerDown(e, desk, deskEl));

        // 椅子のドロップ先
        deskEl.addEventListener('dragover', e => {
          if (mode !== 'normal') return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          deskEl.classList.add('drop-target');
        });
        deskEl.addEventListener('dragleave', e => {
          if (!deskEl.contains(e.relatedTarget)) deskEl.classList.remove('drop-target');
        });
        deskEl.addEventListener('drop', e => {
          e.preventDefault();
          deskEl.classList.remove('drop-target');
          try {
            const data = JSON.parse(e.dataTransfer.getData('application/json'));
            moveSeat(data.deskId, data.seatIndex, desk.id);
          } catch (_) { /* 椅子以外のドロップは無視 */ }
        });

        // 椅子
        chairPositions(w, h, desk.seats.length).forEach((pos, idx) => {
          const chair = document.createElement('div');
          chair.className = 'chair';
          chair.textContent = idx + 1;
          chair.style.left = `${pos.x}px`;
          chair.style.top = `${pos.y}px`;
          chair.style.transform = upright;
          chair.title = 'ダブルクリックするとプールに戻ります';
          chair.draggable = mode === 'normal';
          chair.addEventListener('pointerdown', e => e.stopPropagation());
          chair.addEventListener('dragstart', e => {
            chairDragging = true;
            e.dataTransfer.setData('application/json', JSON.stringify({ deskId: desk.id, seatIndex: idx }));
            e.dataTransfer.effectAllowed = 'move';
            chair.classList.add('dragging');
          });
          chair.addEventListener('dragend', () => {
            chairDragging = false;
            chair.classList.remove('dragging');
          });
          chair.addEventListener('dblclick', e => {
            e.preventDefault();
            e.stopPropagation();
            if (mode !== 'normal') return;
            removeSeatFromDesk(desk, idx);
          });
          deskEl.appendChild(chair);
        });

        floorEl.appendChild(deskEl);
      });

      updatePanel();
      updateStatus();
    }

    // ===== 机のドラッグ（Pointer Eventsでタッチにも対応） =====
    function onDeskPointerDown(e, desk, deskEl) {
      if (e.button !== 0) return;
      if (selectedDeskId !== desk.id) {
        selectedDeskId = desk.id;
        document.querySelectorAll('.desk.selected').forEach(el => el.classList.remove('selected'));
        deskEl.classList.add('selected');
        updatePanel();
      }
      if (mode !== 'edit') return;
      e.preventDefault();
      deskEl.setPointerCapture(e.pointerId);
      deskDrag = { desk, deskEl, startX: e.clientX, startY: e.clientY, origX: desk.x, origY: desk.y, moved: false };
    }

    floorEl.addEventListener('pointermove', e => {
      if (!deskDrag) return;
      const { desk, deskEl } = deskDrag;
      const dx = (e.clientX - deskDrag.startX) / floorScale;
      const dy = (e.clientY - deskDrag.startY) / floorScale;
      desk.x = Math.round((deskDrag.origX + dx) / GRID) * GRID;
      desk.y = Math.round((deskDrag.origY + dy) / GRID) * GRID;
      clampDesk(desk);
      deskEl.style.left = `${desk.x}px`;
      deskEl.style.top = `${desk.y}px`;
      if (desk.x !== deskDrag.origX || desk.y !== deskDrag.origY) deskDrag.moved = true;
    });

    function endDeskDrag() {
      if (!deskDrag) return;
      const moved = deskDrag.moved;
      deskDrag = null;
      if (moved) saveData();
    }
    floorEl.addEventListener('pointerup', endDeskDrag);
    floorEl.addEventListener('pointercancel', endDeskDrag);

    // 見取り図の何もないところをクリックで選択解除
    floorEl.addEventListener('pointerdown', e => {
      if (e.target === floorEl) {
        selectedDeskId = null;
        render();
      }
    });

    // ===== 選択中の机の操作パネル =====
    const panelHint = document.getElementById('panelHint');
    const panelBody = document.getElementById('panelBody');
    const panelName = document.getElementById('panelName');
    const statusBtn = document.getElementById('statusBtn');
    const nameInput = document.getElementById('nameInput');
    const typeSelect = document.getElementById('typeSelect');

    Object.entries(DESK_TYPES).forEach(([key, t]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = t.label;
      typeSelect.appendChild(opt);
    });

    function selectedDesk() {
      return desks.find(d => d.id === selectedDeskId) || null;
    }

    function updatePanel() {
      const desk = selectedDesk();
      if (!desk) {
        selectedDeskId = null;
        panelHint.hidden = false;
        panelBody.hidden = true;
        return;
      }
      panelHint.hidden = true;
      panelBody.hidden = false;
      panelName.textContent = `${desk.name}（${desk.seats.length}席）`;
      statusBtn.textContent = desk.status === 'occupied' ? '使用中 → 空席にする' : '空席 → 使用中にする';
      if (document.activeElement !== nameInput) nameInput.value = desk.name;
      typeSelect.value = desk.type;
    }

    statusBtn.addEventListener('click', () => {
      const desk = selectedDesk();
      if (!desk) return;
      desk.status = desk.status === 'free' ? 'occupied' : 'free';
      commit();
    });

    document.getElementById('panelAddSeatBtn').addEventListener('click', () => {
      message.textContent = '';
      addSeatToDesk(selectedDesk());
    });

    document.getElementById('panelRemoveSeatBtn').addEventListener('click', () => {
      removeSeatFromDesk(selectedDesk());
    });

    nameInput.addEventListener('change', () => {
      const desk = selectedDesk();
      const name = nameInput.value.trim();
      if (!desk || !name) return;
      desk.name = name;
      commit();
    });

    typeSelect.addEventListener('change', () => {
      const desk = selectedDesk();
      if (!desk) return;
      desk.type = typeSelect.value;
      clampDesk(desk);
      commit();
    });

    // 机を中心を軸に 45° ずつ回転させる（delta: -45 = 左回り, 45 = 右回り）
    function rotateSelectedDesk(delta) {
      const desk = selectedDesk();
      if (!desk) return;
      desk.rotation = normalizeRotation(desk.rotation + delta);
      clampDesk(desk);
      commit();
    }
    document.getElementById('rotateLeftBtn').addEventListener('click', () => rotateSelectedDesk(-45));
    document.getElementById('rotateRightBtn').addEventListener('click', () => rotateSelectedDesk(45));

    document.getElementById('deleteDeskBtn').addEventListener('click', () => {
      const desk = selectedDesk();
      if (!desk) return;
      if (!confirm(`${desk.name} を削除しますか？（椅子はプールに戻ります）`)) return;
      // 残り机に戻し、椅子も在庫へ戻す
      remainingDesks += 1;
      remainingSeats += desk.seats.length;
      desks = desks.filter(d => d.id !== desk.id);
      selectedDeskId = null;
      commit();
    });

    // ===== 上部ボタン =====
    // 「机を追加」ボタン：空いている場所に置いて選択する
    document.getElementById('addDeskBtn').addEventListener('click', () => {
      message.textContent = '';
      if (remainingDesks <= 0) {
        message.textContent = '残り机がありません。';
        return;
      }
      const desk = createDesk(nextDeskName(), 0);
      const spot = findFreeSpot(desk);
      desk.x = spot.x;
      desk.y = spot.y;
      desks.push(desk);
      remainingDesks -= 1;
      selectedDeskId = desk.id;
      commit();
    });

    // 「椅子を追加」ボタン：選択中の机（なければ最後に追加した机）に追加
    document.getElementById('addSeatBtn').addEventListener('click', () => {
      message.textContent = '';
      if (desks.length === 0) {
        message.textContent = '先に机を追加してください。';
        return;
      }
      addSeatToDesk(selectedDesk() || desks[desks.length - 1]);
    });

    // 「更新」ボタン：クラウドから最新データを取り直す
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      message.textContent = '';
      await loadData();
      render();
    });

    // モード切替
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.addEventListener('click', () => {
      mode = mode === 'normal' ? 'edit' : 'normal';
      document.body.classList.toggle('mode-edit', mode === 'edit');
      document.body.classList.toggle('mode-normal', mode === 'normal');
      modeBtn.classList.toggle('editing', mode === 'edit');
      modeBtn.textContent = mode === 'edit' ? '配置編集を終了' : '配置編集モードにする';
      message.textContent = mode === 'edit' ? '配置編集モード：机をドラッグして動かせます。' : '';
      render();
    });

    // ===== ページ読み込み時 =====
    window.addEventListener('DOMContentLoaded', async () => {
      fitFloor();
      await loadData();
      render();
    });

    // ===== リアルタイム更新（2秒ごと） =====
    // 操作中・保存直後は、自分の変更が巻き戻らないよう読み込みを止める
    setInterval(async () => {
      if (deskDrag || chairDragging) return;
      if (document.activeElement === nameInput) return;
      if (Date.now() - lastLocalChange < 4000) return;
      await loadData();
      if (deskDrag || chairDragging || Date.now() - lastLocalChange < 4000) return;
      render();
    }, 2000);
  </script>
</body>
</html>
