<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席・机管理</title>
  <style>
    .form-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
    button { border: none; border-radius: 6px; background: #1F487E; color: white; padding: 0.6rem 1.2rem; writing-mode: horizontal-tb; font-size: 0.95rem; cursor: pointer; transition: background-color 0.2s ease; }
    button:hover { background: #1D3461; }
    button:disabled { background: #8a9bb0; cursor: default; }
    .form-row span { font-weight: 600; color: #212121; }
    #message { min-height: 1.4rem; margin-top: 0.5rem; color: #bf360c; }
    #refreshBtn { background: #d31733; font-weight: 600; }
    #refreshBtn:hover { background: #A31621; }
    #modeBtn { background: #37718E; }
    #modeBtn.editing { background: #e08e0b; }

    /* ===== 選択中の机の操作パネル ===== */
    #deskPanel { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem; background: white; border: 1px solid #dce3e8; border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; min-height: 2.6rem; }
    #deskPanel .panel-title { font-weight: 700; }
    #deskPanel input, #deskPanel select { padding: 0.4rem 0.5rem; border: 1px solid #cfd8dc; border-radius: 4px; font-size: 0.95rem; }
    #deskPanel input { width: 7rem; }
    #deskPanel .hint { color: #555; }
    #deskPanel .danger { background: #a33; }
    #deskPanel .danger:hover { background: #811; }
    .edit-only, .normal-only { display: none; }
    body.mode-edit .edit-only, body.mode-normal .normal-only { display: inline-flex; align-items: center; gap: 0.4rem; }

    /* ===== 見取り図 ===== */
    #floorWrap { position: relative; width: 100%; overflow: hidden; }
    #floor { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #f4f1ea; border: 3px solid #5b5b5b; box-sizing: border-box; border-radius: 4px; }
    body.mode-edit #floor { background-color: #fbf8f1; background-image: linear-gradient(#e2ddd2 1px, transparent 1px), linear-gradient(90deg, #e2ddd2 1px, transparent 1px); background-size: 20px 20px; }

    .desk { position: absolute; box-sizing: border-box; border-radius: 5px; border: 2px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; line-height: 1.15; user-select: none; touch-action: none; }
    .desk.free { background: #AED9E0; border-color: #37718E; }
    .desk.occupied { background: #FFA69E; border-color: #C33C54; }
    .desk.selected { outline: 3px solid #e08e0b; outline-offset: 3px; }
    .desk.drop-target { box-shadow: 0 0 0 4px #0288d1; }
    body.mode-edit .desk { cursor: move; }
    body.mode-normal .desk { cursor: pointer; }
    .desk .desk-label { display: flex; flex-direction: column; align-items: center; white-space: nowrap; pointer-events: none; }
    .desk .desk-name { font-weight: 700; pointer-events: none; }
    .desk .desk-info { font-size: 11px; pointer-events: none; }

    .chair { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #e8f4ff; border: 1px solid #5b7c93; box-sizing: border-box; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    body.mode-normal .chair { cursor: grab; }
    .chair.dragging { opacity: 0.4; }
    body.mode-edit .chair { cursor: move; touch-action: none; }
    .side-add { position: absolute; width: 20px; height: 20px; padding: 0; border-radius: 50%; background: #e08e0b; color: white; font-size: 14px; line-height: 20px; text-align: center; }
    .side-add:hover { background: #b86f00; }
    .marquee { position: absolute; border: 1px dashed #e08e0b; background: rgba(224, 142, 11, 0.12); pointer-events: none; }
    #panelBody.multi .single-only { display: none !important; }
  </style>
</head>
<body class="mode-normal" style="background-color: #CED3DC;">
  <h2>机と席の管理</h2>
  <div class="form-row">
    <button id="addDeskBtn" type="button">机を追加</button>
    <span id="deskStatus">残り机: 0</span>
    <button id="addSeatBtn" type="button">椅子を追加</button>
    <span id="seatStatus">残り椅子: 0</span>
    <button id="refreshBtn" type="button">更新</button>
    <button id="modeBtn" type="button">配置編集モードにする</button>
  </div>
  <div>机をクリックで選択。椅子はダブルクリックで削除（プールに戻る）、ドラッグ＆ドロップで机間移動可能。</div>
  <div>机の位置・大きさ・向きを変えるときは<strong>配置編集モード</strong>に切り替えて、机をドラッグしてください。</div>
  <div>変更があった場合、ブラウザの再読み込みボタン、F5ではなく<strong>更新ボタン</strong>をクリックしてください。</div>

  <div id="message" role="status" aria-live="polite"></div>

  <div id="deskPanel">
    <span class="hint" id="panelHint">机をクリックすると、ここで操作できます。</span>
    <span id="panelBody" hidden>
      <span class="panel-title" id="panelName"></span>
      <span class="normal-only single-only">
        <button id="statusBtn" type="button">空席</button>
        <button id="panelAddSeatBtn" type="button">椅子＋</button>
        <button id="panelRemoveSeatBtn" type="button">椅子−</button>
      </span>
      <span class="edit-only single-only">
        <label for="nameInput">名前</label>
        <input id="nameInput" type="text" maxlength="12">
        <label for="typeSelect">大きさ</label>
        <select id="typeSelect"></select>
        <button id="rotateLeftBtn" type="button" title="左に45°回転">⟲ 45°</button>
        <button id="rotateRightBtn" type="button" title="右に45°回転">⟳ 45°</button>
      </span>
      <button id="deleteDeskBtn" type="button" class="danger">机を削除</button>
    </span>
  </div>

  <div id="floorWrap">
    <div id="floor" aria-live="polite"></div>
  </div>

  <script src="seat_layout.js"></script>
  <script>
    // ===== DOM要素の取得 =====
    const floorWrap = document.getElementById('floorWrap');
    const floorEl = document.getElementById('floor');        // 見取り図（机を置く部屋）
    const message = document.getElementById('message');      // メッセージ表示用

    // ===== グローバル変数 =====
    let desks = [];                                           // すべての机のデータ配列
    let totalDesks = 0;                                       // 最初に用意した机の総数
    let totalSeats = 0;                                       // 最初に用意した椅子の総数
    let remainingDesks = 0;                                   // まだ使われていない机の数
    let remainingSeats = 0;                                   // まだ使われていない椅子の数
    let mode = 'normal';                                      // 'normal'（運用）または 'edit'（配置編集）
    let selectedIds = new Set();                              // 選択中の机のID（複数可）
    let deskEls = new Map();                                  // 机ID → 画面上の要素
    let floorScale = 1;
    let deskDrag = null;                                      // 机をドラッグ中の情報
    let marquee = null;                                       // 範囲選択中の情報
    let chairDragging = false;                                // 椅子を別の机へ移動中（通常モード）
    let chairDrag = null;                                     // 椅子の位置を調整中（配置編集モード）
    let lastLocalChange = 0;                                  // 最後に自分が変更した時刻

    function createSeat(id) {
      return { id };
    }

    function createDesk(name, seatCount, pos) {
      const seats = Array.from({ length: seatCount }, (_, i) =>
        createSeat(`${name}-seat-${i + 1}`)
      );
      return {
        id: `${Date.now()}-${Math.random()}`,  // ユニークなID生成
        name,
        seatCount,
        status: 'free',                        // 'free'または'occupied'
        seats,
        type: DEFAULT_TYPE,                    // 机の大きさ（DESK_TYPESのキー）
        rotation: 0,                           // 角度（0〜315、45°刻み）
        x: pos ? pos.x : null,                 // 見取り図上の左上座標
        y: pos ? pos.y : null,
      };
    }

    // 複数の机をまとめて動かせる範囲（どれか1台が壁に当たるまで）
    function groupMoveRange(list) {
      const r = { minDx: -Infinity, maxDx: Infinity, minDy: -Infinity, maxDy: Infinity };
      list.forEach(d => {
        const b = deskBounds(d);
        r.minDx = Math.max(r.minDx, WALL_PAD - b.x);
        r.maxDx = Math.min(r.maxDx, FLOOR_W - WALL_PAD - (b.x + b.w));
        r.minDy = Math.max(r.minDy, WALL_PAD - b.y);
        r.maxDy = Math.min(r.maxDy, FLOOR_H - WALL_PAD - (b.y + b.h));
      });
      // 元々はみ出している机があっても、動かせなくならないようにする
      // 座標が小数にならないよう内側に丸める
      r.minDx = Math.min(Math.ceil(r.minDx), 0); r.maxDx = Math.max(Math.floor(r.maxDx), 0);
      r.minDy = Math.min(Math.ceil(r.minDy), 0); r.maxDy = Math.max(Math.floor(r.maxDy), 0);
      return r;
    }

    function clampDelta(range, dx, dy) {
      return {
        dx: Math.max(range.minDx, Math.min(range.maxDx, dx)),
        dy: Math.max(range.minDy, Math.min(range.maxDy, dy)),
      };
    }

    function nextDeskName() {
      const nums = desks.map(d => Number((d.name.match(/(\d+)$/) || [])[1]) || 0);
      return `机 ${Math.max(0, ...nums) + 1}`;
    }

    // ===== データ保存・読み込み =====
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwZDawi8TC3dBhZqMEACrGEk2GnwVPqa8djNbCMCsPRX8evpzeBYaUZo8gJo8j75ek/exec";

    async function saveDesksToCloud(data) {
      await fetch(CLOUD_URL, {
        method: "POST",
        body: JSON.stringify(data),
      });
    }

    async function loadDesksFromCloud() {
      const res = await fetch(CLOUD_URL);
      return await res.json();
    }

    async function loadData() {
      try {
        const parsed = await loadDesksFromCloud();
        if (!parsed) return;

        // 新しいデータ形式（オブジェクト）
        if (parsed && typeof parsed === 'object' && Array.isArray(parsed.desks)) {
          totalDesks = Number.isInteger(parsed.totalDesks) ? parsed.totalDesks : 0;
          totalSeats = Number.isInteger(parsed.totalSeats) ? parsed.totalSeats : 0;
          remainingDesks = Number.isInteger(parsed.remainingDesks) ? parsed.remainingDesks : 0;
          remainingSeats = Number.isInteger(parsed.remainingSeats) ? parsed.remainingSeats : 0;

          desks = parseDesks(parsed.desks);
        }
      } catch (e) {
        console.warn("クラウド読み込み失敗", e);
      }
    }

    async function saveData() {
      lastLocalChange = Date.now();

      // 使用中の机に置かれている椅子の数を計算
      const occupiedSeats = desks
        .filter(d => d.status === 'occupied')
        .reduce((sum, d) => sum + d.seats.length, 0);

      await saveDesksToCloud({
        totalDesks,
        totalSeats,
        remainingDesks,
        remainingSeats,
        occupiedSeats,  // 使用中の机の椅子数を追加
        desks
      });
      lastLocalChange = Date.now();
    }

    // 変更を保存して画面に反映する
    function commit() {
      saveData();
      render();
    }

    function updateStatus() {
      const deskStatus = document.getElementById('deskStatus');
      const seatStatus = document.getElementById('seatStatus');
      if (deskStatus) deskStatus.textContent = `残り机: ${remainingDesks}`;
      if (seatStatus) seatStatus.textContent = `残り椅子: ${remainingSeats}`;
    }

    // ===== 見取り図の拡大縮小 =====
    function fitFloor() {
      floorScale = Math.min(1, floorWrap.clientWidth / FLOOR_W);
      floorEl.style.width = `${FLOOR_W}px`;
      floorEl.style.height = `${FLOOR_H}px`;
      floorEl.style.transform = `scale(${floorScale})`;
      floorWrap.style.height = `${FLOOR_H * floorScale}px`;
    }
    window.addEventListener('resize', fitFloor);

    // 画面上の移動量 → 机の向きに合わせた移動量（机が回転していても見た目どおりに動かす）
    function screenToLocal(desk, sx, sy) {
      const rad = desk.rotation * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return { x: sx * cos + sy * sin, y: -sx * sin + sy * cos };
    }

    // 机の左上からの相対座標 p に一番近い辺（椅子を置けない辺は除く）
    function nearestSide(desk, p) {
      const { w, h } = deskSize(desk);
      const caps = sideCaps(desk);
      const cx = Math.max(0, Math.min(w, p.x));
      const cy = Math.max(0, Math.min(h, p.y));
      const dist = {
        top: Math.hypot(p.x - cx, p.y),
        bottom: Math.hypot(p.x - cx, p.y - h),
        left: Math.hypot(p.x, p.y - cy),
        right: Math.hypot(p.x - w, p.y - cy),
      };
      return SIDES.filter(k => caps[k] > 0).reduce((a, b) => (dist[b] < dist[a] ? b : a));
    }

    // 辺に沿った位置（上下の辺なら x、左右の辺なら y）
    function alongSide(side, p) {
      return side === 'top' || side === 'bottom' ? p.x : p.y;
    }

    // 椅子を指定の辺へ移す。同じ辺の中では、落とした位置の順に並べる
    function placeSeatOnSide(desk, idx, side, along) {
      const seat = desk.seats[idx];
      if (!seat) return;
      const caps = sideCaps(desk), counts = sideCounts(desk);
      if (seat.side !== side && counts[side] >= caps[side]) {
        message.textContent = `その辺はもう満員です（最大 ${caps[side]} つ）。`;
        render();
        return;
      }
      desk.seats.splice(idx, 1);
      seat.side = side;
      const layout = chairLayout(desk);
      let insertAt = -1, lastSame = -1;
      desk.seats.forEach((s, i) => {
        if (s.side !== side || insertAt >= 0) return;
        if (alongSide(side, layout[i]) > along) insertAt = i;
        else lastSame = i;
      });
      if (insertAt < 0) insertAt = lastSame >= 0 ? lastSame + 1 : desk.seats.length;
      desk.seats.splice(insertAt, 0, seat);
      message.textContent = '';
      commit();
    }

    // ===== 椅子の移動 =====
    function moveSeat(fromDeskId, seatIndex, toDeskId) {
      const fromDesk = desks.find(d => d.id === fromDeskId);
      const toDesk = desks.find(d => d.id === toDeskId);
      if (!fromDesk || !toDesk || fromDesk === toDesk) return;
      const side = freeSide(toDesk);
      if (!side) {
        message.textContent = `${toDesk.name} は満員です（最大 ${deskCapacity(toDesk)} 席）。`;
        return;
      }
      const movedSeat = fromDesk.seats.splice(seatIndex, 1)[0];
      if (!movedSeat) return;
      movedSeat.side = side;   // 移動先では空いている辺に置く
      toDesk.seats.push(movedSeat);
      fromDesk.seatCount = fromDesk.seats.length;
      toDesk.seatCount = toDesk.seats.length;
      commit();
    }

    // side を省略すると、空いている辺（長い辺を優先）に追加する
    function addSeatToDesk(desk, side) {
      if (!desk) return;
      if (remainingSeats <= 0) {
        message.textContent = '残り椅子がありません。';
        return;
      }
      const target = side || freeSide(desk);
      if (!target || sideCounts(desk)[target] >= sideCaps(desk)[target]) {
        message.textContent = side
          ? `その辺はもう満員です（最大 ${sideCaps(desk)[side]} つ）。`
          : `${desk.name} は満員です（最大 ${deskCapacity(desk)} 席）。`;
        return;
      }
      const seat = createSeat(`${desk.name}-seat-${desk.seats.length + 1}`);
      seat.side = target;
      desk.seats.push(seat);
      desk.seatCount = desk.seats.length;
      remainingSeats -= 1;
      message.textContent = '';
      commit();
    }

    function removeSeatFromDesk(desk, idx) {
      if (!desk || desk.seats.length === 0) return;
      const i = idx == null ? desk.seats.length - 1 : idx;
      if (!desk.seats.splice(i, 1)[0]) return;
      desk.seatCount = desk.seats.length;
      remainingSeats += 1;
      message.textContent = `椅子をプールに戻しました。残り椅子: ${remainingSeats}`;
      commit();
    }

    // ===== 辺の「＋」ボタン（配置編集モードで机を1台選択中） =====
    function refreshSideButtons() {
      floorEl.querySelectorAll('.side-add').forEach(el => el.remove());
      if (mode !== 'edit' || selectedIds.size !== 1) return;
      const desk = selectedDesk();
      const deskEl = desk && deskEls.get(desk.id);
      if (!deskEl) return;
      const { w, h } = deskSize(desk);
      const caps = sideCaps(desk), counts = sideCounts(desk);
      SIDES.forEach(k => {
        if (counts[k] >= caps[k]) return;   // 満員・置けない辺には出さない
        const p = sidePoint(k, 0.5, w, h, CHAIR_SIZE + 16);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'side-add';
        btn.textContent = '＋';
        btn.title = `この辺に椅子を追加（${counts[k]} / ${caps[k]}）`;
        btn.style.left = `${p.x - 10}px`;
        btn.style.top = `${p.y - 10}px`;
        btn.style.transform = `rotate(${-desk.rotation}deg)`;
        btn.addEventListener('pointerdown', e => e.stopPropagation());
        btn.addEventListener('click', e => {
          e.stopPropagation();
          addSeatToDesk(desk, k);
        });
        deskEl.appendChild(btn);
      });
    }

    // ===== 描画 =====
    function render() {
      floorEl.innerHTML = '';
      deskEls = new Map();

      desks.forEach(desk => {
        const { w, h } = deskSize(desk);
        const deskEl = document.createElement('div');
        deskEl.className = `desk ${desk.status}` + (selectedIds.has(desk.id) ? ' selected' : '');
        deskEl.dataset.id = desk.id;
        deskEls.set(desk.id, deskEl);
        deskEl.style.left = `${desk.x}px`;
        deskEl.style.top = `${desk.y}px`;
        deskEl.style.width = `${w}px`;
        deskEl.style.height = `${h}px`;
        deskEl.style.transform = `rotate(${desk.rotation}deg)`;
        // 文字は傾かないよう逆向きに回す
        const upright = `rotate(${-desk.rotation}deg)`;

        const label = document.createElement('span');
        label.className = 'desk-label';
        label.style.transform = upright;
        const name = document.createElement('span');
        name.className = 'desk-name';
        name.textContent = desk.name;
        const info = document.createElement('span');
        info.className = 'desk-info';
        const over = desk.seats.length > deskCapacity(desk);
        info.textContent = `${desk.status === 'occupied' ? '使用中' : '空席'} / ${desk.seats.length}席` + (over ? ' ⚠' : '');
        label.append(name, info);
        deskEl.append(label);

        // 机の選択・ドラッグ（配置編集モードのみ移動）
        deskEl.addEventListener('pointerdown', e => onDeskPointerDown(e, desk, deskEl));

        // 椅子のドロップ先
        deskEl.addEventListener('dragover', e => {
          if (mode !== 'normal') return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          deskEl.classList.add('drop-target');
        });
        deskEl.addEventListener('dragleave', e => {
          if (!deskEl.contains(e.relatedTarget)) deskEl.classList.remove('drop-target');
        });
        deskEl.addEventListener('drop', e => {
          e.preventDefault();
          deskEl.classList.remove('drop-target');
          try {
            const data = JSON.parse(e.dataTransfer.getData('application/json'));
            moveSeat(data.deskId, data.seatIndex, desk.id);
          } catch (_) { /* 椅子以外のドロップは無視 */ }
        });

        // 椅子
        const layout = chairLayout(desk);
        desk.seats.forEach((seat, idx) => {
          const pos = layout[idx];
          const chair = document.createElement('div');
          chair.className = 'chair';
          chair.textContent = idx + 1;
          chair.style.left = `${pos.x}px`;
          chair.style.top = `${pos.y}px`;
          chair.style.transform = upright;
          chair.title = mode === 'edit'
            ? 'ドラッグして別の辺へ移動、ダブルクリックでプールに戻ります'
            : 'ダブルクリックするとプールに戻ります';
          chair.draggable = mode === 'normal';
          chair.addEventListener('pointerdown', e => {
            e.stopPropagation();
            if (mode !== 'edit' || e.button !== 0) return;
            // 配置編集モード：椅子をドラッグして別の辺へ移す
            e.preventDefault();
            if (!selectedIds.has(desk.id) || selectedIds.size !== 1) {
              selectedIds = new Set([desk.id]);
              refreshSelection();
            }
            chair.setPointerCapture(e.pointerId);
            const cur = chairLayout(desk)[idx];
            chairDrag = { desk, idx, el: chair, startX: e.clientX, startY: e.clientY, origX: cur.x, origY: cur.y, pos: cur, moved: false };
          });
          chair.addEventListener('dragstart', e => {
            chairDragging = true;
            e.dataTransfer.setData('application/json', JSON.stringify({ deskId: desk.id, seatIndex: idx }));
            e.dataTransfer.effectAllowed = 'move';
            chair.classList.add('dragging');
          });
          chair.addEventListener('dragend', () => {
            chairDragging = false;
            chair.classList.remove('dragging');
          });
          chair.addEventListener('dblclick', e => {
            e.preventDefault();
            e.stopPropagation();
            removeSeatFromDesk(desk, idx);
          });
          deskEl.appendChild(chair);
        });

        floorEl.appendChild(deskEl);
      });

      updatePanel();
      refreshSideButtons();
      updateStatus();
    }

    // ===== 選択 =====
    function selectedDesks() {
      return desks.filter(d => selectedIds.has(d.id));
    }

    // 選択状態だけを画面に反映する（全体の再描画はしない）
    function refreshSelection() {
      deskEls.forEach((el, id) => el.classList.toggle('selected', selectedIds.has(id)));
      updatePanel();
      refreshSideButtons();
    }

    // 画面上の座標 → 見取り図の座標
    function toFloorPoint(e) {
      const rect = floorEl.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / floorScale - floorEl.clientLeft,
        y: (e.clientY - rect.top) / floorScale - floorEl.clientTop,
      };
    }

    // 机の要素の位置を、データに合わせて更新する
    function placeDeskEl(desk) {
      const el = deskEls.get(desk.id);
      if (!el) return;
      el.style.left = `${desk.x}px`;
      el.style.top = `${desk.y}px`;
    }

    // ===== 机のドラッグ（Pointer Eventsでタッチにも対応） =====
    function onDeskPointerDown(e, desk, deskEl) {
      if (e.button !== 0) return;

      // 配置編集モードで Shift / Ctrl を押しながらクリック：選択に追加・解除
      if (mode === 'edit' && (e.shiftKey || e.ctrlKey || e.metaKey)) {
        if (selectedIds.has(desk.id)) selectedIds.delete(desk.id);
        else selectedIds.add(desk.id);
        refreshSelection();
        return;
      }

      // 選択されていない机を押したら、その机だけを選択する
      if (!selectedIds.has(desk.id)) {
        selectedIds = new Set([desk.id]);
        refreshSelection();
      }
      if (mode !== 'edit') return;

      // 選択中の机をまとめてドラッグ
      e.preventDefault();
      deskEl.setPointerCapture(e.pointerId);
      const list = selectedDesks();
      deskDrag = {
        startX: e.clientX,
        startY: e.clientY,
        items: list.map(d => ({ desk: d, origX: d.x, origY: d.y })),
        range: groupMoveRange(list),
        moved: false,
      };
    }

    floorEl.addEventListener('pointermove', e => {
      if (deskDrag) {
        const rawDx = Math.round((e.clientX - deskDrag.startX) / floorScale / GRID) * GRID;
        const rawDy = Math.round((e.clientY - deskDrag.startY) / floorScale / GRID) * GRID;
        const { dx, dy } = clampDelta(deskDrag.range, rawDx, rawDy);
        deskDrag.items.forEach(it => {
          it.desk.x = it.origX + dx;
          it.desk.y = it.origY + dy;
          placeDeskEl(it.desk);
        });
        if (dx !== 0 || dy !== 0) deskDrag.moved = true;
      } else if (chairDrag) {
        const d = chairDrag;
        const l = screenToLocal(d.desk, (e.clientX - d.startX) / floorScale, (e.clientY - d.startY) / floorScale);
        d.pos = { x: d.origX + l.x, y: d.origY + l.y };
        d.el.style.left = `${d.pos.x}px`;
        d.el.style.top = `${d.pos.y}px`;
        if (Math.hypot(d.pos.x - d.origX, d.pos.y - d.origY) > 3) d.moved = true;
      } else if (marquee) {
        updateMarquee(toFloorPoint(e));
      }
    });

    function endPointer() {
      if (deskDrag) {
        const moved = deskDrag.moved;
        deskDrag = null;
        if (moved) saveData();
      }
      if (chairDrag) {
        const d = chairDrag;
        chairDrag = null;
        if (d.moved) {
          // 放した位置に一番近い辺へ移す
          const side = nearestSide(d.desk, d.pos);
          placeSeatOnSide(d.desk, d.idx, side, alongSide(side, d.pos));
        }
      }
      if (marquee) {
        const tiny = marquee.width < 3 && marquee.height < 3;
        marquee.el.remove();
        // 範囲を広げずにクリックしただけなら選択解除
        if (tiny && !marquee.additive) selectedIds = new Set();
        marquee = null;
        refreshSelection();
      }
    }
    floorEl.addEventListener('pointerup', endPointer);
    floorEl.addEventListener('pointercancel', endPointer);

    // ===== 範囲選択（見取り図の何もないところからドラッグ） =====
    floorEl.addEventListener('pointerdown', e => {
      if (e.target !== floorEl || e.button !== 0) return;
      if (mode !== 'edit') {
        // 通常モードでは選択解除のみ
        selectedIds = new Set();
        refreshSelection();
        return;
      }
      e.preventDefault();
      floorEl.setPointerCapture(e.pointerId);
      const p = toFloorPoint(e);
      const el = document.createElement('div');
      el.className = 'marquee';
      floorEl.appendChild(el);
      const additive = e.shiftKey || e.ctrlKey || e.metaKey;
      marquee = { el, startX: p.x, startY: p.y, width: 0, height: 0, additive, base: additive ? new Set(selectedIds) : new Set() };
      updateMarquee(p);
    });

    function updateMarquee(p) {
      const x = Math.min(marquee.startX, p.x), y = Math.min(marquee.startY, p.y);
      const w = Math.abs(p.x - marquee.startX), h = Math.abs(p.y - marquee.startY);
      Object.assign(marquee.el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
      marquee.width = w;
      marquee.height = h;
      // 枠に触れた机を選択する
      const next = new Set(marquee.base);
      desks.forEach(d => {
        const b = deskBounds(d);
        if (b.x < x + w && x < b.x + b.w && b.y < y + h && y < b.y + b.h) next.add(d.id);
      });
      selectedIds = next;
      deskEls.forEach((el, id) => el.classList.toggle('selected', selectedIds.has(id)));
    }

    // ===== 選択中の机の操作パネル =====
    const panelHint = document.getElementById('panelHint');
    const panelBody = document.getElementById('panelBody');
    const panelName = document.getElementById('panelName');
    const statusBtn = document.getElementById('statusBtn');
    const nameInput = document.getElementById('nameInput');
    const typeSelect = document.getElementById('typeSelect');

    Object.entries(DESK_TYPES).forEach(([key, t]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = t.label;
      typeSelect.appendChild(opt);
    });

    // 1台だけ選択しているときはその机、それ以外は null
    function selectedDesk() {
      const list = selectedDesks();
      return list.length === 1 ? list[0] : null;
    }

    function updatePanel() {
      // 削除された机を選択から外す
      selectedIds = new Set(selectedDesks().map(d => d.id));
      const list = selectedDesks();
      panelHint.hidden = list.length > 0;
      panelBody.hidden = list.length === 0;
      panelBody.classList.toggle('multi', list.length > 1);
      deleteDeskBtn.textContent = list.length > 1 ? 'まとめて削除' : '机を削除';
      if (list.length > 1) {
        panelName.textContent = `${list.length}台選択中（ドラッグでまとめて移動）`;
        return;
      }
      const desk = list[0];
      if (!desk) return;
      const cap = deskCapacity(desk);
      panelName.textContent = `${desk.name}（${desk.seats.length} / ${cap}席）`
        + (desk.seats.length > cap ? ' ⚠ 定員オーバー：椅子を減らしてください' : '');
      statusBtn.textContent = desk.status === 'occupied' ? '使用中 → 空席にする' : '空席 → 使用中にする';
      if (document.activeElement !== nameInput) nameInput.value = desk.name;
      typeSelect.value = desk.type;
    }

    statusBtn.addEventListener('click', () => {
      const desk = selectedDesk();
      if (!desk) return;
      desk.status = desk.status === 'free' ? 'occupied' : 'free';
      commit();
    });

    document.getElementById('panelAddSeatBtn').addEventListener('click', () => {
      message.textContent = '';
      addSeatToDesk(selectedDesk());
    });

    document.getElementById('panelRemoveSeatBtn').addEventListener('click', () => {
      removeSeatFromDesk(selectedDesk());
    });

    nameInput.addEventListener('change', () => {
      const desk = selectedDesk();
      const name = nameInput.value.trim();
      if (!desk || !name) return;
      desk.name = name;
      commit();
    });

    typeSelect.addEventListener('change', () => {
      const desk = selectedDesk();
      if (!desk) return;
      const oldType = desk.type;
      desk.type = typeSelect.value;
      const cap = deskCapacity(desk);
      const extra = desk.seats.length - cap;
      if (extra > 0) {
        const ok = confirm(`${DESK_TYPES[desk.type].label}には椅子を ${cap} つまでしか置けません。\n多い ${extra} つを残り椅子に戻しますか？`);
        if (!ok) {
          desk.type = oldType;
          typeSelect.value = oldType;
          return;
        }
        desk.seats.splice(cap);
        desk.seatCount = desk.seats.length;
        remainingSeats += extra;
      }
      normalizeSides(desk);
      clampDesk(desk);
      commit();
    });

    // 机を中心を軸に 45° ずつ回転させる（delta: -45 = 左回り, 45 = 右回り）
    function rotateSelectedDesk(delta) {
      const desk = selectedDesk();
      if (!desk) return;
      desk.rotation = normalizeRotation(desk.rotation + delta);
      clampDesk(desk);
      commit();
    }
    document.getElementById('rotateLeftBtn').addEventListener('click', () => rotateSelectedDesk(-45));
    document.getElementById('rotateRightBtn').addEventListener('click', () => rotateSelectedDesk(45));

    const deleteDeskBtn = document.getElementById('deleteDeskBtn');
    deleteDeskBtn.addEventListener('click', () => {
      const list = selectedDesks();
      if (list.length === 0) return;
      const label = list.length === 1 ? list[0].name : `${list.length}台の机`;
      if (!confirm(`${label} を削除しますか？（椅子はプールに戻ります）`)) return;
      // 残り机に戻し、椅子も在庫へ戻す
      list.forEach(desk => {
        remainingDesks += 1;
        remainingSeats += desk.seats.length;
      });
      desks = desks.filter(d => !selectedIds.has(d.id));
      selectedIds = new Set();
      commit();
    });

    // ===== 上部ボタン =====
    // 「机を追加」ボタン：空いている場所に置いて選択する
    document.getElementById('addDeskBtn').addEventListener('click', () => {
      message.textContent = '';
      if (remainingDesks <= 0) {
        message.textContent = '残り机がありません。';
        return;
      }
      const desk = createDesk(nextDeskName(), 0);
      const spot = findFreeSpot(desk, desks);
      desk.x = spot.x;
      desk.y = spot.y;
      desks.push(desk);
      remainingDesks -= 1;
      selectedIds = new Set([desk.id]);
      commit();
    });

    // 「椅子を追加」ボタン：選択中の机（なければ最後に追加した机）に追加
    document.getElementById('addSeatBtn').addEventListener('click', () => {
      message.textContent = '';
      if (desks.length === 0) {
        message.textContent = '先に机を追加してください。';
        return;
      }
      addSeatToDesk(selectedDesk() || desks[desks.length - 1]);
    });

    // 「更新」ボタン：クラウドから最新データを取り直す
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      message.textContent = '';
      await loadData();
      render();
    });

    // モード切替
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.addEventListener('click', () => {
      mode = mode === 'normal' ? 'edit' : 'normal';
      document.body.classList.toggle('mode-edit', mode === 'edit');
      document.body.classList.toggle('mode-normal', mode === 'normal');
      modeBtn.classList.toggle('editing', mode === 'edit');
      modeBtn.textContent = mode === 'edit' ? '配置編集を終了' : '配置編集モードにする';
      message.textContent = mode === 'edit'
        ? '配置編集モード：机をドラッグして動かせます。何もないところからドラッグすると範囲選択できます。'
        : '';
      // 複数選択は配置編集モードだけなので、通常モードに戻るときは解除する
      if (mode === 'normal' && selectedIds.size > 1) selectedIds = new Set();
      render();
    });

    // ===== 矢印キーで移動（配置編集モードのみ） =====
    // 選択中の机を 10 ずつ、Shift を押しながらなら 1 ずつ動かす
    const ARROW_KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    let keySaveTimer = null;

    // キーを押すたびに保存すると送信が多すぎるので、止まってから 0.5 秒後にまとめて保存
    function scheduleSave() {
      lastLocalChange = Date.now();
      clearTimeout(keySaveTimer);
      keySaveTimer = setTimeout(() => saveData(), 500);
    }

    document.addEventListener('keydown', e => {
      if (mode !== 'edit' || !ARROW_KEYS[e.key]) return;
      // 文字入力中は何もしない
      const t = e.target;
      if (t && (t.isContentEditable || ['INPUT', 'SELECT', 'TEXTAREA'].includes(t.tagName))) return;
      if (deskDrag || marquee || chairDrag) return;
      const [ux, uy] = ARROW_KEYS[e.key];

      // 机を選択中
      const list = selectedDesks();
      if (list.length === 0) return;
      e.preventDefault();   // ページのスクロールを止める
      const step = e.shiftKey ? 1 : GRID;
      const { dx, dy } = clampDelta(groupMoveRange(list), ux * step, uy * step);
      if (dx === 0 && dy === 0) return;
      list.forEach(d => {
        d.x += dx;
        d.y += dy;
        placeDeskEl(d);
      });
      scheduleSave();
    });

    // ===== ページ読み込み時 =====
    window.addEventListener('DOMContentLoaded', async () => {
      fitFloor();
      await loadData();
      render();
    });

    // ===== リアルタイム更新（2秒ごと） =====
    // 操作中・保存直後は、自分の変更が巻き戻らないよう読み込みを止める
    setInterval(async () => {
      const busy = () => deskDrag || marquee || chairDrag || chairDragging || Date.now() - lastLocalChange < 4000;
      if (busy() || document.activeElement === nameInput) return;
      await loadData();
      if (busy()) return;
      render();
    }, 2000);
  </script>
</body>
</html>
