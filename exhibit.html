    <script>
      function resizeMasonryGrid() {
        const row = document.querySelector('.box-row');
        const boxes = document.querySelectorAll('.box');
        const verticalGap = 20; 

        if (!row) return;

        boxes.forEach(box => {
          // 1つのボックス（画像＋テキスト）の実際の高さを取得
          const boxHeight = box.getBoundingClientRect().height;
          
          // 高さと隙間を足して、何マス分（span）必要か計算
          const rowSpan = Math.ceil(boxHeight + verticalGap);
          
          // 計算したマス数を適用
          box.style.gridRowEnd = `span ${rowSpan}`;
        });
      }

      // 画像の読み込み完了を待ってから計算を実行する
      window.addEventListener('load', resizeMasonryGrid);
      window.addEventListener('resize', resizeMasonryGrid);
    </script>
