  <script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwZDawi8TC3dBhZqMEACrGEk2GnwVPqa8djNbCMCsPRX8evpzeBYaUZo8gJo8j75ek/exec";

    async function loadSeatStatus() {
      try {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        
        if (data && data.remainingSeats !== undefined && data.totalSeats !== undefined) {
          const statusText = document.getElementById('status-text');
          if (statusText) {
            // 使用中の机に置かれている椅子数を分子として計算
            const occupiedSeats = data.occupiedSeats || 0;
            const percentage = data.totalSeats > 0 
              ? Math.round((occupiedSeats / data.totalSeats) * 100) 
              : 0;
              if (percentage >= 100) {
                statusText.innerHTML = "現在満席です<br>( TДT)ｺﾞﾒﾝﾖｰ ";
                statusText.style.color = "#FF5252"; // 満席の場合は赤色にする
                statusText.style.fontWeight = "bold";
                return;
              } else {
                // statusText.textContent = `${percentage}%`;
                statusText.textContent = `使用率: ${percentage}% / 残り ${data.totalSeats - occupiedSeats} 席`;
              }

              if (percentage < 50) {
                statusText.style.color = "white"; // 白色
              } else if (percentage < 80) {
                statusText.style.color = "#FFEE58";   // 黄色
              } else {
                statusText.style.color = "#FFA726"; // オレンジ
              }

            // statusText.textContent = `${percentage}%`;
          }
        }
      } catch (e) {
        console.warn("空席状況の読み込み失敗", e);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      //new Splide('#image-carousel', {type: 'loop'}).mount();
      
      // 空席状況を読み込み
      loadSeatStatus();
      
      // 5秒ごとに更新
      setInterval(loadSeatStatus, 5000);
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.addEventListener('load', function () {
        const marquee = document.querySelector('.marqueer ul'); 
        if (!marquee) return;

        const items = Array.from(marquee.children);             
        if (items.length === 0) return;

        // スピード調整：1枚が通り過ぎるのに「8秒」かける
        // もしこれでも早ければ、10 や 12 に増やす
        const speedSeconds = 8;                                 

        // 「1番目の画像」の正確な幅を取得
        const itemWidth = items[0].getBoundingClientRect().width;
        if (itemWidth === 0) return;

        // 無限ループ用に「1番目の画像」だけを最後に複製して隙間なくくっつける
        marquee.appendChild(items[0].cloneNode(true));

        let currentIdx = 0;   // 今何枚目を見ているかのカウンター
        let pos = 0;          // 現在のアニメーション位置
        
        // 1フレームあたりの移動ピクセル数
        const pixelsPerFrame = itemWidth / (speedSeconds * 60);

        function animate() {
          // 左方向へゆっくり進める
          pos -= pixelsPerFrame;

          // 1枚分の幅を完全に移動し終えたら
          if (pos <= -(itemWidth * (currentIdx + 1))) {
            currentIdx++; 

            // 31枚すべて流れて、複製した「1番目」に到達したら、先頭にワープ
            if (currentIdx >= items.length) {
              currentIdx = 0;
              pos = 0;
            }
          }

          marquee.style.transform = `translateX(${pos}px)`;
          requestAnimationFrame(animate);
        }

        animate();
      });
    });
  </script>
