  <script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwZDawi8TC3dBhZqMEACrGEk2GnwVPqa8djNbCMCsPRX8evpzeBYaUZo8gJo8j75ek/exec";

    // 簡易見取り図を描く（机と椅子の形だけ。使用中の机は赤）
    function drawSeatMap(rawDesks) {
      const wrap = document.getElementById('seat-map-wrap');
      const svg = document.getElementById('seat-map');
      if (!wrap || !svg) return;
      if (!Array.isArray(rawDesks) || rawDesks.length === 0) {
        wrap.hidden = true;
        return;
      }
      const desks = parseDesks(rawDesks);
      // 部屋の枠（数値だけを埋め込むので innerHTML で問題ない）
      let html = `<rect class="room" x="2" y="2" width="${FLOOR_W - 4}" height="${FLOOR_H - 4}" rx="8"/>`;
      desks.forEach(d => {
        const { w, h } = deskSize(d);
        const cx = d.x + w / 2, cy = d.y + h / 2;
        const cls = d.status === 'occupied' ? 'occupied' : 'free';
        html += `<g class="${cls}" transform="rotate(${d.rotation} ${cx} ${cy})">`;
        html += `<rect class="desk" x="${d.x}" y="${d.y}" width="${w}" height="${h}" rx="5"/>`;
        chairLayout(d).forEach(p => {
          html += `<circle class="chair" cx="${d.x + p.x}" cy="${d.y + p.y}" r="${CHAIR_SIZE / 2}"/>`;
        });
        html += '</g>';
      });
      svg.innerHTML = html;
      wrap.hidden = false;
    }

    async function loadSeatStatus() {
      try {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();

        // 見取り図を更新（失敗しても席数の表示は続ける）
        try {
          drawSeatMap(data && data.desks);
        } catch (e) {
          console.warn("見取り図の描画失敗", e);
        }

        if (data && data.remainingSeats !== undefined && data.totalSeats !== undefined) {
          const statusText = document.getElementById('status-text');
          if (statusText) {
            // 使用中の机に置かれている椅子数を分子として計算
            const occupiedSeats = data.occupiedSeats || 0;
            const percentage = data.totalSeats > 0 
              ? Math.round((occupiedSeats / data.totalSeats) * 100) 
              : 0;
              if (percentage >= 100) {
                statusText.innerHTML = "現在満席です<br>( TДT)ｺﾞﾒﾝﾖｰ ";
                statusText.style.color = "#FF5252"; // 満席の場合は赤色にする
                statusText.style.fontWeight = "bold";
                return;
              } else {
                // statusText.textContent = `${percentage}%`;
                statusText.textContent = `使用率: ${percentage}% / 残り ${data.totalSeats - occupiedSeats} 席`;
              }

              if (percentage < 50) {
                statusText.style.color = "#f0f6da"; // ホワイトリリー
              } else if (percentage < 80) {
                statusText.style.color = "#FFEE58";   // 黄色
              } else {
                statusText.style.color = "#FFA726"; // オレンジ
              }

            // statusText.textContent = `${percentage}%`;
          }
        }
      } catch (e) {
        console.warn("空席状況の読み込み失敗", e);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      //new Splide('#image-carousel', {type: 'loop'}).mount();
      
      // 空席状況を読み込み
      loadSeatStatus();
      
      // 5秒ごとに更新
      setInterval(loadSeatStatus, 5000);
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.addEventListener('load', function () {
        const marquee = document.querySelector('.marqueer ul'); 
        if (!marquee) return;

        const items = Array.from(marquee.children);             
        if (items.length === 0) return;

        // スピード調整：1枚が通り過ぎるのに「8秒」かける
        // もしこれでも早ければ、10 や 12 に増やす
        const speedSeconds = 8;                                 

        // 「1番目の画像」の正確な幅を取得
        const itemWidth = items[0].getBoundingClientRect().width;
        if (itemWidth === 0) return;

        // 無限ループ用に「1番目の画像」だけを最後に複製して隙間なくくっつける
        marquee.appendChild(items[0].cloneNode(true));

        let currentIdx = 0;   // 今何枚目を見ているかのカウンター
        let pos = 0;          // 現在のアニメーション位置
        
        // 1フレームあたりの移動ピクセル数
        const pixelsPerFrame = itemWidth / (speedSeconds * 60);

        function animate() {
          // 左方向へゆっくり進める
          pos -= pixelsPerFrame;

          // 1枚分の幅を完全に移動し終えたら
          if (pos <= -(itemWidth * (currentIdx + 1))) {
            currentIdx++; 

            // 31枚すべて流れて、複製した「1番目」に到達したら、先頭にワープ
            if (currentIdx >= items.length) {
              currentIdx = 0;
              pos = 0;
            }
          }

          marquee.style.transform = `translateX(${pos}px)`;
          requestAnimationFrame(animate);
        }

        animate();
      });
    });
  </script>
